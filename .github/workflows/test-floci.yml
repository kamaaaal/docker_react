name: Test Floci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.FLOCI_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.FLOCI_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Test Floci
        run: |
          aws sts get-caller-identity \
            --endpoint-url "${{ vars.FLOCI_ENDPOINT }}"
      - name: List ECR repositories
        run: |
          aws ecr describe-repositories \
            --endpoint-url "${{ vars.FLOCI_ENDPOINT }}"